dataset:
  table_name: "network_flows_clean"
  days:
    - "2017-07-03" # Monday (Benign)
    - "2017-07-04" # Tuesday (Brute Force: FTP-Patator, SSH-Patator)
    - "2017-07-05" # Wednesday (DoS: Hulk, GoldenEye, Slowloris, Slowhttptest, Heartbleed)
    - "2017-07-06" # Thursday (Web Attack & Infiltration)
    - "2017-07-07" # Friday (Bot, PortScan, DDoS)

windowing:
  window_sizes_sec: [60, 300, 600]
  horizons_k: [1, 3, 5]
  assign_by: "end_time"
  overnight_gap_minutes: 60

features:
  rolling_window_L: 5
  novelty_lookback_N: 5
  corr_prune_threshold: 0.95
  lags: [1, 2, 3]

labels:
  share_threshold: 0.20
  flow_floor_60: 15
  flow_floor_300: 60
  flow_floor_600: 110
  calm_lookback_C: 3

splits:
  scheme_a_ratios: [0.60, 0.20, 0.20]
  min_val_surges: 5
  min_val_onsets: 2

models:
  seed: 42
  xgboost:
    max_depth: 3
    learning_rate: 0.05
    n_estimators: 200
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 5
    reg_lambda: 2.0
  lightgbm:
    num_leaves: 7
    max_depth: 3
    learning_rate: 0.05
    n_estimators: 200
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_samples: 15
    reg_lambda: 2.0

alerts:
  budgets_per_day:
    warning: 6
    critical: 2
  default_thresholds:
    watch: 0.25
    warning: 0.50
    critical: 0.75
  hysteresis:
    rise_confirmations: 2
    fall_confirmations: 2
    critical_trend_windows: 3
